<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Canaan Copeland</title>

        <!-- Favicon — hardcoded to the auto-generated file so it's present
             immediately, before any JS runs. theme.js will still update this
             tag's href at runtime if theme.json specifies a different icon,
             but this guarantees something always shows up. -->
        <link rel="icon" type="image/png" href="/media/favicon.png" />
        <link rel="shortcut icon" href="/favicon.png" />

        <!-- OG / Twitter / description meta tags are injected dynamically by
             the server (see lib/routes.js: serveHomepageWithEmbed) from this
             page's <title> tag, config/master.json's "slogan", and
             /media/logo.png. Nothing here is hardcoded on purpose — anyone
             deploying their own copy of this site just edits the <title>
             above and the "slogan" in config/master.json, and their embed
             updates automatically. If server-side injection ever fails
             (e.g. this file is served as a raw static file some other way),
             no OG tags are added at all — the page still works, it just
             won't have a rich embed. -->

        <link rel="stylesheet" href="./css/main.css" />
    </head>
    <body>
        <header class="topbar" aria-label="Top navigation">
            <nav class="topbar-inner" id="topbarList" aria-label="Topbar list"></nav>
        </header>

        <main id="content" aria-label="Main content"></main>

        <aside class="sidebar sidebar--loading" aria-label="Quick links">
            <nav class="sidebar-inner" id="sidebarList" aria-label="Sidebar list"></nav>
        </aside>

        <script src="./js/main.js" type="module"></script>
    </body>
</html>

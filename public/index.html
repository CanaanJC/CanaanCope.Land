<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Portfolio</title>

        <!-- Favicon set — hardcoded to the auto-generated files in
             media/favicon/ so something always shows up immediately, before
             any JS runs. theme.js will still update the <link rel="icon">
             tag's href at runtime if theme.json specifies a different icon,
             but these guarantee correct defaults out of the box. All three
             are generated once (if missing) from media/logo.png by
             lib/favicon.js and never overwritten afterward — see that file
             for details. -->
        <link rel="icon" type="image/png" href="/media/favicon/favicon.png" />
        <link rel="shortcut icon" href="/media/favicon/favicon.ico" />
        <link rel="apple-touch-icon" href="/media/favicon/apple-touch-icon.png" />

        <!-- OG / Twitter / description meta tags, and this <title> tag's
             contents, are all injected/overwritten dynamically by the server
             (see lib/routes.js: serveHomepageWithEmbed) from config/master.json's
             "siteName" and "slogan", and /media/logo.png. The <title> above
             is just a placeholder shown only if siteName is ever empty — it
             is never required to be edited by hand. If server-side injection
             ever fails (e.g. this file is served as a raw static file some
             other way), no OG tags are added and the placeholder title above
             is what's shown — the page still works, it just won't have a
             rich embed or a live title. -->

        <link rel="stylesheet" href="./css/main.css" />
    </head>
    <body>
        <header class="topbar" aria-label="Top navigation">
            <nav class="topbar-inner" id="topbarList" aria-label="Topbar list"></nav>
        </header>

        <main id="content" aria-label="Main content"></main>

        <aside class="sidebar sidebar--loading" aria-label="Quick links">
            <nav class="sidebar-inner" id="sidebarList" aria-label="Sidebar list"></nav>
        </aside>

        <script src="./js/main.js" type="module"></script>
    </body>
</html>

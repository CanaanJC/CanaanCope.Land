<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>M5 Max Count Down</title>

<!-- Discord-friendly OG tags -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="canaancope.land">
<meta property="og:title" content="M5 Max Count Down">
<meta property="og:description" content="M5 Max Arrival Countdown">
<meta property="og:url" content="https://canaancope.land/mac.html">
<meta property="og:image" content="https://canaancope.land/thumb.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="M5 Max Count Down">
<meta name="twitter:image" content="https://canaancope.land/thumb.png">
<meta name="theme-color" content="#000000">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.title{position:fixed;top:24px;left:0;width:100%;text-align:center;
  font-family:'Helvetica Neue',Arial,sans-serif;font-size:2.4rem;font-weight:700;
  color:#fff;text-shadow:0 2px 12px rgba(0,0,0,0.8);z-index:2}
.title .est{font-size:1rem;font-weight:400;opacity:0.65;vertical-align:super}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;
  display:flex;align-items:center;justify-content:center;pointer-events:none}
#countdown{font-family:'Courier New',Courier,monospace;font-weight:700;
  color:#fff;text-shadow:0 2px 14px rgba(0,0,0,0.85);letter-spacing:0.04em;
  white-space:nowrap}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="title">M5 Max Arrival <span class="est">(est)</span></div>
<div class="overlay"><div id="countdown">00D | 00H | 00M | 00.0S</div></div>
<script>
/* =============================================
   GIF PLAYBACK SPEED MULTIPLIER
   1.00 = normal | 0.50 = half | 2.00 = double
   ============================================= */
const GIF_SPEED = 0.70;

/* Countdown target: 2026-03-13 14:00 EDT (Toronto) */
const TARGET = new Date('2026-03-16T13:15:00-04:00');

/* ---------- Auto-sizing Countdown ---------- */
(function () {
  const el = document.getElementById('countdown');
  const maxPx = 72;
  let cachedWidth = 0;

  function fitFont() {
    const avail = el.parentElement.clientWidth * 0.92;
    if (avail === cachedWidth) return;
    cachedWidth = avail;
    el.style.fontSize = maxPx + 'px';
    if (el.scrollWidth > avail) {
      el.style.fontSize = Math.floor(maxPx * avail / el.scrollWidth) + 'px';
    }
  }

  window.addEventListener('resize', () => { cachedWidth = 0; fitFont(); });

  function tick() {
    let ms = Math.max(0, TARGET - new Date());
    const d = Math.floor(ms / 86400000); ms %= 86400000;
    const h = Math.floor(ms / 3600000);  ms %= 3600000;
    const m = Math.floor(ms / 60000);    ms %= 60000;
    const s = (Math.floor(ms / 100) / 10).toFixed(1);
    el.textContent =
      String(d).padStart(2, '0') + 'D | ' +
      String(h).padStart(2, '0') + 'H | ' +
      String(m).padStart(2, '0') + 'M | ' +
      s.padStart(4, '0') + 'S';
    fitFont();
    requestAnimationFrame(tick);
  }
  tick();
})();

/* ---------- GIF Decoder & Player ---------- */
(async function () {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let buf;
  try {
    const res = await fetch('./mac.gif');
    buf = new Uint8Array(await res.arrayBuffer());
  } catch (e) { console.error('Failed to load mac.gif', e); return; }

  let p = 0;
  const u8  = () => buf[p++];
  const u16 = () => { const v = buf[p] | (buf[p + 1] << 8); p += 2; return v; };

  p = 6;
  const gifW = u16(), gifH = u16();
  const lsdPacked = u8();
  const gctFlag = lsdPacked >> 7;
  const gctLen = 1 << ((lsdPacked & 7) + 1);
  u8(); u8();

  let gct = null;
  if (gctFlag) {
    gct = new Uint8Array(gctLen * 3);
    for (let i = 0; i < gctLen * 3; i++) gct[i] = buf[p++];
  }

  const ofc = document.createElement('canvas');
  ofc.width = gifW; ofc.height = gifH;
  const oCtx = ofc.getContext('2d');

  const frames = [];
  let gce = { delay: 100, disposal: 0, ti: -1 };
  let prevDisposal = 0, prevReg = null, savedState = null;

  function lzwDecode(minCode, data, count) {
    const clear = 1 << minCode, eoi = clear + 1;
    let size = minCode + 1, mask = (1 << size) - 1;
    let table = new Array(clear + 2);
    for (let i = 0; i < clear; i++) table[i] = [i];
    let next = eoi + 1, bits = 0, bc = 0, bp = 0, prev = -1;
    const out = new Uint8Array(count);
    let op = 0;
    const readCode = () => {
      while (bc < size) { if (bp >= data.length) return -1; bits |= data[bp++] << bc; bc += 8; }
      const c = bits & mask; bits >>= size; bc -= size; return c;
    };
    while (op < count) {
      const code = readCode();
      if (code === -1 || code === eoi) break;
      if (code === clear) {
        size = minCode + 1; mask = (1 << size) - 1;
        table = new Array(clear + 2);
        for (let i = 0; i < clear; i++) table[i] = [i];
        next = eoi + 1; prev = -1; continue;
      }
      let entry;
      if (code < next) entry = table[code];
      else if (code === next && prev >= 0) entry = table[prev].concat(table[prev][0]);
      else break;
      for (let i = 0; i < entry.length && op < count; i++) out[op++] = entry[i];
      if (prev >= 0 && next < 4096) {
        table[next++] = table[prev].concat(entry[0]);
        if (next > mask && size < 12) { size++; mask = (1 << size) - 1; }
      }
      prev = code;
    }
    return out;
  }

  while (p < buf.length) {
    const b = u8();
    if (b === 0x3B) break;

    if (b === 0x21) {
      const label = u8();
      if (label === 0xF9) {
        u8();
        const gp = u8(), delay = u16(), ti = u8();
        u8();
        gce = { disposal: (gp >> 2) & 7, ti: (gp & 1) ? ti : -1, delay: Math.max(delay * 10, 20) };
      } else {
        while (true) { const sz = u8(); if (!sz) break; p += sz; }
      }
      continue;
    }

    if (b === 0x2C) {
      const left = u16(), top = u16(), w = u16(), h = u16();
      const ip = u8();
      const lctFlag = ip >> 7, interlace = (ip >> 6) & 1;
      const lctLen = lctFlag ? (1 << ((ip & 7) + 1)) : 0;
      let ct = gct;
      if (lctFlag) {
        ct = new Uint8Array(lctLen * 3);
        for (let i = 0; i < lctLen * 3; i++) ct[i] = buf[p++];
      }
      const minCode = u8();
      const comp = [];
      while (true) { const sz = u8(); if (!sz) break; for (let i = 0; i < sz; i++) comp.push(buf[p++]); }
      const pixels = lzwDecode(minCode, comp, w * h);

      if (prevDisposal === 2 && prevReg) oCtx.clearRect(prevReg.x, prevReg.y, prevReg.w, prevReg.h);
      else if (prevDisposal === 3 && savedState) oCtx.putImageData(savedState, 0, 0);

      if (gce.disposal === 3) savedState = oCtx.getImageData(0, 0, gifW, gifH);

      const rowMap = new Int32Array(h);
      if (interlace) {
        let r = 0;
        for (let y = 0; y < h; y += 8) rowMap[r++] = y;
        for (let y = 4; y < h; y += 8) rowMap[r++] = y;
        for (let y = 2; y < h; y += 4) rowMap[r++] = y;
        for (let y = 1; y < h; y += 2) rowMap[r++] = y;
      } else { for (let y = 0; y < h; y++) rowMap[y] = y; }

      const imgData = oCtx.getImageData(left, top, w, h);
      const dd = imgData.data;
      for (let srcRow = 0; srcRow < h; srcRow++) {
        const dstRow = rowMap[srcRow];
        for (let x = 0; x < w; x++) {
          const ci = pixels[srcRow * w + x];
          if (ci === gce.ti) continue;
          const di = (dstRow * w + x) * 4, ci3 = ci * 3;
          if (ct && ci3 + 2 < ct.length) {
            dd[di] = ct[ci3]; dd[di + 1] = ct[ci3 + 1]; dd[di + 2] = ct[ci3 + 2]; dd[di + 3] = 255;
          }
        }
      }
      oCtx.putImageData(imgData, left, top);

      frames.push({ data: oCtx.getImageData(0, 0, gifW, gifH), delay: gce.delay });
      prevDisposal = gce.disposal;
      prevReg = { x: left, y: top, w: w, h: h };
      gce = { delay: 100, disposal: 0, ti: -1 };
      continue;
    }
  }

  if (!frames.length) { console.warn('No frames decoded'); return; }

  const tmp = document.createElement('canvas');
  tmp.width = gifW; tmp.height = gifH;
  const tCtx = tmp.getContext('2d');

  let fi = 0, acc = 0, last = performance.now(), needsDraw = true;

  window.addEventListener('resize', () => { needsDraw = true; });

  function drawCurrent() {
    tCtx.putImageData(frames[fi].data, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const scale = Math.max(canvas.width / gifW, canvas.height / gifH);
    const dw = gifW * scale, dh = gifH * scale;
    ctx.drawImage(tmp, (canvas.width - dw) / 2, (canvas.height - dh) / 2, dw, dh);
  }

  function render() {
    const now = performance.now();
    acc += (now - last) * GIF_SPEED;
    last = now;
    let advanced = false;
    while (acc >= frames[fi].delay) {
      acc -= frames[fi].delay;
      fi = (fi + 1) % frames.length;
      advanced = true;
    }
    if (advanced || needsDraw) { drawCurrent(); needsDraw = false; }
    requestAnimationFrame(render);
  }

  drawCurrent();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>

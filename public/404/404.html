<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 Not Found</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/404/404.css" />
  </head>
  <body>
    <div id="notfound-page">
      <h1 class="notfound-title">404</h1>

      <div id="notfound-media" class="notfound-media">
        <img id="notfound-image" class="notfound-image" src="/404/404.png" alt="404 Not Found" />
        <video id="notfound-video" class="notfound-video" src="/404/404.mp4" preload="auto" loop playsinline hidden></video>
      </div>

      <div class="notfound-actions">
        <button id="notfound-play-dino" class="notfound-link" type="button">Play The Dino Game</button>
        <button id="notfound-fix" class="notfound-link" type="button">Fix the Issue</button>
      </div>
    </div>

    <script type="module" src="/js/theme.js"></script>
    <script src="/404/404.js"></script>
  </body>
</html>

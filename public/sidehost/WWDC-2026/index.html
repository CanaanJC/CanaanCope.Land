<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WWDC26 Countdown</title>
    <style>
        :root {
            --text: rgba(255, 255, 255, 0.96);
            --shadow: rgba(0, 0, 0, 0.45);
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-image: url('https://developer.apple.com/wwdc26/wallpaper/images/mac/large_2x.jpg');
            background-size: 210%;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        }

        body {
            position: relative;
            display: grid;
            place-items: center;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(circle at center, rgba(255, 255, 255, 0.04), rgba(0, 0, 0, 0.28) 55%, rgba(0, 0, 0, 0.5) 100%),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.34));
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .clock-wrap {
            position: relative;
            z-index: 2;
            padding: 24px 34px;
            border-radius: 28px;
            background: var(--glass);
            border: 1px solid var(--border);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(18px) saturate(1.2);
            -webkit-backdrop-filter: blur(18px) saturate(1.2);
        }

        .clock {
            color: var(--text);
            font-weight: 700;
            font-size: clamp(3.5rem, 12vw, 10rem);
            line-height: 1;
            letter-spacing: -0.06em;
            text-align: center;
            text-shadow:
                0 4px 24px var(--shadow),
                0 0 30px rgba(255, 255, 255, 0.08);
            font-variant-numeric: tabular-nums;
            user-select: none;
        }

        .ended {
            font-size: clamp(2rem, 6vw, 4rem);
            letter-spacing: -0.04em;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="clock-wrap">
        <div id="clock" class="clock">00:00:00</div>
    </div>

    <script>
        const targetDate = new Date("2026-06-08T10:00:00-07:00");
        const clock = document.getElementById("clock");

        function pad(value) {
            return String(value).padStart(2, "0");
        }

        function updateClock() {
            const now = new Date();
            let diff = targetDate - now;

            if (diff <= 0) {
                clock.textContent = "00:00:00";
                return;
            }

            const hours = Math.floor(diff / (1000 * 60 * 60));
            diff -= hours * 1000 * 60 * 60;

            const minutes = Math.floor(diff / (1000 * 60));
            diff -= minutes * 1000 * 60;

            const seconds = Math.floor(diff / 1000);

            clock.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>

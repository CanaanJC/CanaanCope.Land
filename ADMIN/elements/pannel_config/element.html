<h2 id="le-title">Panel Layout</h2>

<div class="le-controls">
    <label for="le-column-count" class="le-controls-label">Columns:</label>
    <select id="le-column-count" class="le-select">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
    </select>
</div>

<div class="le-available">
    <h3 class="le-subheading">Available Elements</h3>
    <p class="le-hint">Drag an element into a column below. Drag the same one in more than once to duplicate it. Drag a column item back onto this list (or click its ×) to remove it.</p>
    <div id="le-available-list" class="le-list"></div>
</div>

<h3 class="le-subheading le-subheading--columns">Layout</h3>
<div id="le-columns" class="le-columns"></div>

<button id="le-save" class="admin-button" type="button">Save Changes</button>
<p id="le-status" class="admin-status"></p>

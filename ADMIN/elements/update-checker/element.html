<h2>Updates</h2>
<div class="uc-row">
    <div class="uc-versions">
        <div class="uc-version-line"><span class="uc-label">Current version:</span> <span id="uc-local">…</span></div>
        <div class="uc-version-line"><span class="uc-label">Latest release:</span> <span id="uc-remote">…</span></div>
    </div>
    <button id="uc-refresh" class="uc-refresh-btn" type="button" title="Check for updates now">⟳</button>
</div>
<div id="uc-banner" class="uc-banner" hidden>
    <p class="uc-banner-text">Update available! To update run <code>sudo ./scripts/update.sh</code> in server root.</p>
</div>
<p id="uc-status" class="admin-status"></p>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin</title>
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body>
    <header class="admin-header">
      <a id="admin-domain-link" class="admin-header-link" href="#">
        <img id="admin-domain-logo" class="admin-logo" src="" alt="Site logo" />
        <span class="admin-header-label">Public Page</span>
      </a>
      <a id="admin-local-link" class="admin-header-link" href="#">
        <img id="admin-local-logo" class="admin-logo" src="" alt="Site logo" />
        <span class="admin-header-label">Local Page</span>
      </a>
      <a id="admin-library-link" class="admin-header-link" href="/library-explorer/">
        <svg id="admin-library-icon" class="admin-logo admin-logo--folder" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 6a2 2 0 0 1 2-2h4.7l2 2H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" fill="#d8b04a" stroke="#5a5a5a" stroke-width="1"/>
        </svg>
        <span class="admin-header-label">Library Explorer</span>
      </a>
    </header>

    <main id="admin-columns" class="admin-columns"></main>

    <script type="module" src="/js/admin.js"></script>
  </body>
</html>

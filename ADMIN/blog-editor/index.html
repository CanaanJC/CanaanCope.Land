<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog Editor</title>
    <link rel="stylesheet" href="/css/admin.css" />
    <link rel="stylesheet" href="/elements/lib/css/json.css" />
    <link rel="stylesheet" href="/blog-editor/css/blog-editor-layout.css" />
    <link rel="stylesheet" href="/blog-editor/css/blog-editor-topbar.css" />
    <link rel="stylesheet" href="/blog-editor/css/blog-editor-toolbar.css" />
    <link rel="stylesheet" href="/blog-editor/css/blog-editor-modals.css" />
    <link rel="stylesheet" href="/blog-editor/css/blog-editor-preview.css" />
    <link rel="stylesheet" href="/blog-editor/css/blog-editor-media.css" />
    <link rel="stylesheet" href="/blog-editor/css/highlight.css" />
  </head>
  <body>
    <header class="be-topbar">
      <button id="be-main-btn" class="admin-button" type="button" title="Return to admin main page">← Main</button>

      <div class="be-dropdown">
        <button id="be-dropdown-btn" class="admin-button" type="button">Select a blog ▾</button>
        <div id="be-dropdown-panel" class="be-dropdown-panel" hidden></div>
      </div>

      <button id="be-preview-toggle" class="admin-button" type="button" disabled>Show Preview</button>

      <div id="be-mode-toggle-group" class="be-mode-toggle" role="group" aria-label="Edit mode">
        <button id="be-mode-content" class="be-toggle-btn be-toggle-btn--active" type="button" disabled>content.md</button>
        <button id="be-mode-config" class="be-toggle-btn" type="button" disabled>config.json</button>
      </div>

      <button id="be-save" class="admin-button" type="button" disabled>Save</button>

      <a id="be-current-path" class="be-current-path" href="#" target="_blank" rel="noopener noreferrer" title="Open the live article in a new tab"></a>
    </header>

    <main class="be-main">
      <div id="be-editor-view" class="be-editor-view">
        <div id="be-left" class="be-panel be-panel--left">
          <p class="be-placeholder">Select a blog post from the dropdown to begin editing.</p>
        </div>
        <div id="be-right" class="be-panel be-panel--right">
          <div id="be-toolbar" class="be-toolbar"></div>
          <div id="be-media-divider" class="be-media-divider"></div>
          <div id="be-media-manager" class="be-media-manager">
            <p class="be-placeholder be-placeholder--media">Select a blog post to manage its media.</p>
          </div>
        </div>
      </div>

      <div id="be-preview-view" class="be-preview-view" hidden>
        <div id="be-preview-container" class="be-preview-container">
          <iframe id="be-preview-iframe" class="be-preview-iframe" src="about:blank"></iframe>
        </div>
      </div>
    </main>

    <div id="be-help-buttons" class="be-help-buttons">
      <button id="be-media-help-btn" class="admin-button be-tool-help-btn" type="button" title="Media reference">Media Help</button>
      <button id="be-tags-help-btn" class="admin-button be-tool-help-btn" type="button" title="Tag reference">Tags Help</button>
    </div>

    <script type="module" src="/blog-editor/js/blog-editor.js"></script>
  </body>
</html>
